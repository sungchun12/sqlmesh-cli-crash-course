gateways:
  duckdb:
    connection:
      type: duckdb
      database: db.db
  snowflake:
    connection:
      type: duckdb
      database: snowflake.db

default_gateway: duckdb

model_defaults:
  dialect: duckdb
  start: 2020-01-01

linter:
  enabled: true
  rules: ["ambiguousorinvalidcolumn", "invalidselectstarexpansion"] # raise errors for these rules
  warn_rules: ["noselectstar", "nomissingaudits"]
  # ignored_rules: ["noselectstar"]